<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure QR Studio</title>
  <!-- QRCode.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .card { width: 100%; max-width: 480px; background: var(--card); padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); border: 1px solid var(--border); }
    h1 { font-size: 1.35rem; font-weight: 700; text-align: center; margin-bottom: 4px; }
    p.sub { font-size: 0.85rem; color: var(--muted); text-align: center; margin-bottom: 18px; }
    
    .tab-group { display: flex; gap: 8px; margin-bottom: 14px; }
    .tab-btn { flex: 1; padding: 9px; font-size: 0.85rem; border: 1px solid var(--border); background: var(--bg); border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.2s; }
    .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 5px; }
    input[type="text"], input[type="url"], input[type="password"], textarea {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; outline: none; transition: border-color 0.2s;
    }
    input:focus, textarea:focus { border-color: var(--primary); }
    textarea { resize: vertical; min-height: 55px; }

    .color-row { display: flex; gap: 12px; }
    .color-box { flex: 1; }
    .color-box input[type="color"] { width: 100%; height: 38px; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; padding: 2px; }

    button.primary-btn { width: 100%; background: var(--primary); color: #fff; border: none; padding: 12px; border-radius: 8px; font-size: 0.98rem; font-weight: 600; cursor: pointer; margin-top: 6px; }
    button.primary-btn:hover { background: var(--primary-hover); }

    .result-section { display: none; margin-top: 20px; text-align: center; border-top: 1px dashed var(--border); padding-top: 18px; }
    #qrcode { display: flex; justify-content: center; margin: 14px 0; }
    #qrcode canvas, #qrcode img { border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }

    .download-btn { display: inline-flex; align-items: center; justify-content: center; width: 100%; background: #10b981; color: white; padding: 11px; border-radius: 8px; font-weight: 600; border: none; cursor: pointer; text-decoration: none; margin-top: 10px; font-size: 0.95rem; }
    .download-btn:hover { background: #059669; }

    .msg { font-size: 0.9rem; margin-top: 12px; font-weight: 600; text-align: center; }
    .msg.err { color: #dc2626; }
    .msg.ok { color: #16a34a; }

    .display-title { font-size: 1.2rem; font-weight: 700; text-align: center; margin-bottom: 4px; }
    .display-desc { font-size: 0.88rem; color: var(--muted); text-align: center; margin-bottom: 14px; white-space: pre-wrap; }
    .preview-img { max-width: 100%; max-height: 250px; object-fit: contain; border-radius: 8px; margin: 10px 0; border: 1px solid var(--border); }
  </style>
</head>
<body>

  <div class="card">
    <!-- VIEW 1: CREATOR -->
    <div id="creator-view">
      <h1>Protected QR Studio</h1>
      <p class="sub">Set password lock for links, photos, and files</p>

      <!-- TAB SELECTION -->
      <div class="tab-group">
        <button type="button" class="tab-btn active" onclick="setMode('url')">Drive / URL</button>
        <button type="button" class="tab-btn" onclick="setMode('image')">Photo Link</button>
        <button type="button" class="tab-btn" onclick="setMode('file')">File Link</button>
      </div>

      <form onsubmit="handleGenerate(event)">
        <!-- URL Input -->
        <div class="form-group">
          <label id="inputLabel">Google Drive / Target Link</label>
          <input type="url" id="linkInput" placeholder="https://drive.google.com/..." required />
        </div>

        <!-- QR Name/Title -->
        <div class="form-group">
          <label>QR Title / Name</label>
          <input type="text" id="titleInput" placeholder="e.g. My Protected File" required />
        </div>

        <!-- Description -->
        <div class="form-group">
          <label>QR Description / Note (Optional)</label>
          <textarea id="descInput" placeholder="Add custom instructions or note..."></textarea>
        </div>

        <!-- Colors -->
        <div class="color-row form-group">
          <div class="color-box">
            <label>QR Color</label>
            <input type="color" id="qrColor" value="#000000" />
          </div>
          <div class="color-box">
            <label>Background Color</label>
            <input type="color" id="qrBgColor" value="#ffffff" />
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label>Set Password</label>
          <input type="password" id="passInput" placeholder="Enter password to lock" required />
        </div>

        <button type="submit" class="primary-btn">Generate Protected QR</button>
      </form>

      <!-- RESULT -->
      <div id="result" class="result-section">
        <label>Generated QR Code:</label>
        <div id="qrcode"></div>
        <button type="button" class="download-btn" onclick="downloadQR()">⬇ Download QR (PNG)</button>
      </div>
    </div>

    <!-- VIEW 2: UNLOCK SCREEN -->
    <div id="unlock-view" style="display: none;">
      <h2 class="display-title" id="outTitle">🔒 Locked Content</h2>
      <p class="display-desc" id="outDesc">Enter password to view content.</p>

      <form onsubmit="handleUnlock(event)">
        <div class="form-group">
          <label>Enter Password</label>
          <input type="password" id="unlockPass" placeholder="Password" required />
        </div>
        <button type="submit" class="primary-btn">Unlock Content</button>
      </form>

      <div id="unlock-status" class="msg"></div>
      
      <div id="unlocked-content" style="display: none; margin-top: 15px; text-align: center;">
        <div id="contentRenderer"></div>
      </div>
    </div>
  </div>

  <script>
    let currentMode = 'url';

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      const label = document.getElementById("inputLabel");
      const input = document.getElementById("linkInput");

      if (mode === 'url') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        label.innerText = "Google Drive / Target URL";
        input.placeholder = "https://drive.google.com/...";
      } else if (mode === 'image') {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        label.innerText = "Photo / Image URL (Direct Link)";
        input.placeholder = "https://example.com/photo.jpg or Google Drive photo link";
      } else {
        document.querySelectorAll('.tab-btn')[2].classList.add('active');
        label.innerText = "File URL (PDF / Doc / ZIP link)";
        input.placeholder = "https://drive.google.com/... or download URL";
      }
    }

    // XOR Cipher
    function xorCipher(text, pass) {
      let res = '';
      for (let i = 0; i < text.length; i++) {
        res += String.fromCharCode(text.charCodeAt(i) ^ pass.charCodeAt(i % pass.length));
      }
      return res;
    }

    // Auto-detect Unlock URL
    window.addEventListener("DOMContentLoaded", () => {
      const hash = window.location.hash;
      if (hash.startsWith("#data=")) {
        document.getElementById("creator-view").style.display = "none";
        document.getElementById("unlock-view").style.display = "block";
      }
    });

    function handleGenerate(e) {
      e.preventDefault();
      const link = document.getElementById("linkInput").value.trim();
      const title = document.getElementById("titleInput").value.trim();
      const desc = document.getElementById("descInput").value.trim();
      const pass = document.getElementById("passInput").value;
      const color = document.getElementById("qrColor").value;
      const bgColor = document.getElementById("qrBgColor").value;

      if (!link || !pass) return alert("Please fill all required fields");

      const payload = JSON.stringify({
        title,
        desc,
        type: currentMode,
        data: link
      });

      // Encrypt
      const encrypted = btoa(unescape(encodeURIComponent(xorCipher(payload, pass))));
      const baseUrl = window.location.href.split("#")[0];
      const targetUrl = `${baseUrl}#data=${encodeURIComponent(encrypted)}`;

      // Render QR
      const qrBox = document.getElementById("qrcode");
      qrBox.innerHTML = "";
      
      new QRCode(qrBox, {
        text: targetUrl,
        width: 220,
        height: 220,
        colorDark: color,
        colorLight: bgColor,
        correctLevel: QRCode.CorrectLevel.M
      });

      document.getElementById("result").style.display = "block";
    }

    // 100% Working Canvas-to-PNG Downloader
    function downloadQR() {
      const canvas = document.querySelector("#qrcode canvas");
      let dataUrl = "";

      if (canvas) {
        dataUrl = canvas.toDataURL("image/png");
      } else {
        const img = document.querySelector("#qrcode img");
        if (img) dataUrl = img.src;
      }

      if (!dataUrl) {
        alert("Please generate QR code first!");
        return;
      }

      const a = document.createElement("a");
      a.href = dataUrl;
      const filename = (document.getElementById("titleInput").value || "secure_qr").replace(/[^a-zA-Z0-9_-]/g, "_");
      a.download = `${filename}.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function handleUnlock(e) {
      e.preventDefault();
      const pass = document.getElementById("unlockPass").value;
      const status = document.getElementById("unlock-status");
      const outBox = document.getElementById("unlocked-content");
      const renderer = document.getElementById("contentRenderer");

      try {
        const hash = window.location.hash.replace("#data=", "");
        const raw = decodeURIComponent(hash);
        const decryptedStr = xorCipher(decodeURIComponent(escape(atob(raw))), pass);
        const obj = JSON.parse(decryptedStr);

        status.className = "msg ok";
        status.innerText = "✓ Unlocked successfully!";

        document.getElementById("outTitle").innerText = obj.title || "Unlocked Content";
        document.getElementById("outDesc").innerText = obj.desc || "";

        renderer.innerHTML = "";
        if (obj.type === 'url') {
          renderer.innerHTML = `
            <a href="${obj.data}" target="_blank" class="download-btn" style="background: #2563eb;">Open Google Drive Link ↗</a>
          `;
          setTimeout(() => { window.location.href = obj.data; }, 800);
        } else if (obj.type === 'image') {
          renderer.innerHTML = `
            <img src="${obj.data}" class="preview-img" alt="Unlocked Image Preview" onerror="this.style.display='none'" />
            <a href="${obj.data}" target="_blank" class="download-btn">Open / Download Photo ↗</a>
          `;
        } else {
          renderer.innerHTML = `
            <a href="${obj.data}" target="_blank" class="download-btn">Open / Download File ↗</a>
          `;
        }

        outBox.style.display = "block";
      } catch (err) {
        status.className = "msg err";
        status.innerText = "❌ Incorrect password!";
        outBox.style.display = "none";
      }
    }
  </script>
</body>
</html>
